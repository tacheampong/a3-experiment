<!DOCTYPE html>
<html>
<head>
    <title>Team Score Pie Chart - BW</title>
</head>
<body>
<div id="container"></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script type="module">

    const width = 500;
    const height = 500;
    const radius = Math.min(width, height) / 2 - 40;

    const data = [
        {team: "A", score: 38},
        {team: "B", score: 10}
    ];

    // Create Pie and Arc Generators
    const pie = d3.pie()
        .value(d => d.score)
        .sort(null); 

    const arc = d3.arc()
        .innerRadius(0)
        .outerRadius(radius);

    const labelArc = d3.arc()
        .innerRadius(radius - 40)
        .outerRadius(radius - 40);

    const svg = d3.select("#container")
        .append("svg")
        .attr("width", width)
        .attr("height", height)
        .append("g")
        .attr("transform", `translate(${width / 2}, ${height / 2})`);

    // Draw the Slices in Grayscale
    const arcs = svg.selectAll("arc")
        .data(pie(data))
        .enter()
        .append("g");

    arcs.append("path")
        .attr("d", arc)
        // Set Team A to Light Gray and Team B to Dark Gray/Black for contrast
        .attr("fill", (d, i) => i === 0 ? "#eeeeee" : "#333333") 
        .attr("stroke", "black")
        .style("stroke-width", "2px");

    // Add Labels with inverted colors for legibility
    arcs.append("text")
        .attr("transform", d => `translate(${labelArc.centroid(d)})`)
        .attr("text-anchor", "middle")
        // Black text on light slice, White text on dark slice
        .attr("fill", (d, i) => i === 0 ? "black" : "white") 
        .style("font-size", "16px")
        .style("font-family", "sans-serif")
        .style("font-weight", "bold")
        .text(d => d.data.team);

    // Title
    svg.append("text")
        .attr("x", 0)
        .attr("y", -radius - 15)
        .attr("text-anchor", "middle")
        .attr("fill", "black")
        .style("font-size", "20px")
        .style("font-family", "sans-serif")
        .text("Team Scores");

</script>
</body>
</html>
