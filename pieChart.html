<!DOCTYPE html>
<html>
<head>
    <title>Team Score Pie Chart</title>
</head>
<body>
<div id="container"></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script type="module">

    // 1. Setup dimensions
    const width = 500;
    const height = 500;
    const radius = Math.min(width, height) / 2 - 40;

    const data = [
        {team: "A", score: 38},
        {team: "B", score: 10}
    ];

    // 2. Set up Color Scale
    const color = d3.scaleOrdinal()
        .domain(data.map(d => d.team))
        .range(d3.schemeCategory10);

    // 3. Create Pie and Arc Generators
    const pie = d3.pie()
        .value(d => d.score)
        .sort(null); // Keeps the order of the data array

    const arc = d3.arc()
        .innerRadius(0) // Set this > 0 for a donut chart
        .outerRadius(radius);

    const labelArc = d3.arc()
        .innerRadius(radius - 40)
        .outerRadius(radius - 40);

    // 4. Create SVG
    const svg = d3.select("#container")
        .append("svg")
        .attr("width", width)
        .attr("height", height)
        .append("g")
        .attr("transform", `translate(${width / 2}, ${height / 2})`);

    // 5. Draw the Slices
    const arcs = svg.selectAll("arc")
        .data(pie(data))
        .enter()
        .append("g");

    arcs.append("path")
        .attr("d", arc)
        .attr("fill", d => color(d.data.team))
        .attr("stroke", "white")
        .style("stroke-width", "2px");

    // 6. Add Labels
    arcs.append("text")
        .attr("transform", d => `translate(${labelArc.centroid(d)})`)
        .attr("text-anchor", "middle")
        .attr("fill", "white")
        .style("font-size", "16px")
        .style("font-weight", "bold")
        .text(d => d.data.team);

    // 7. Add Title
    svg.append("text")
        .attr("x", 0)
        .attr("y", -radius - 10)
        .attr("text-anchor", "middle")
        .style("font-size", "20px")
        .text("Team Scores");

</script>
</body>
</html>
