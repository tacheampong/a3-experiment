<!DOCTYPE html>
<html>
<head>
    <title>Team Score Pie Chart - High Contrast BW</title>
</head>
<body>
<div id="container"></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script type="module">

    const width = 400;
    const height = 400;
    const radius = Math.min(width, height) / 2 - 40;

    const data = [
        {team: "A", score: 27},
        {team: "B", score: 3}
    ];

    const pie = d3.pie()
        .value(d => d.score)
        .sort(null); 

    const arc = d3.arc()
        .innerRadius(0)
        .outerRadius(radius);

    const labelArc = d3.arc()
        .innerRadius(radius - 50)
        .outerRadius(radius - 50);

    const svg = d3.select("#container")
        .append("svg")
        .attr("width", width)
        .attr("height", height);

    // Ensure background is explicitly white
    svg.append("rect")
        .attr("width", width)
        .attr("height", height)
        .attr("fill", "white");

    const g = svg.append("g")
        .attr("transform", `translate(${width / 2}, ${height / 2})`);

    // Draw the Slices
    const arcs = g.selectAll("arc")
        .data(pie(data))
        .enter()
        .append("g");

    arcs.append("path")
        .attr("d", arc)
        // Team A is white, Team B is black
        .attr("fill", (d, i) => i === 0 ? "white" : "black") 
        .attr("stroke", "black")
        .style("stroke-width", "4px"); // Bold black lines

    // Add Labels with high contrast
    arcs.append("text")
        .attr("transform", d => `translate(${labelArc.centroid(d)})`)
        .attr("text-anchor", "middle")
        // Black text on white slice, White text on black slice
        .attr("fill", (d, i) => i === 0 ? "black" : "white") 
        .style("font-size", "18px")
        .style("font-family", "sans-serif")
        .style("font-weight", "bold")
        .text(d => d.data.team);

    // Chart Title
    g.append("text")
        .attr("x", 0)
        .attr("y", -radius - 15)
        .attr("text-anchor", "middle")
        .attr("fill", "black")
        .style("font-size", "22px")
        .style("font-family", "sans-serif")
        .style("font-weight", "bold")
        .text("Team Scores");

</script>
</body>
</html>
